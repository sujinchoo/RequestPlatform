{% extends "base.html" %}

{% block title %}로그인{% endblock %}
{% block header_title %}대리점 / 본사 로그인{% endblock %}

{% block content %}
<section class="sheet sheet-hero">

  <!-- 🔹 TPR System 배너 -->
  <div class="tpr-banner">
    <img src="{{ url_for('static', filename='images/tpr-banner.png') }}"
         alt="TPR System - Truck People Request System"
         class="tpr-banner-img" />
    <div class="tpr-banner-text">
      <div class="tpr-banner-title">TPR System </div>
      <div class="tpr-banner-sub">Truck · People · Request Board</div>
    </div>
  </div>

  <div class="hero-title">로그인</div>
  <p class="hero-sub">
    대리점 ID와 비밀번호를 입력해 주세요. 본사 계정(admin)은 대시보드 접근이 가능합니다.
  </p>
</section>

<section class="sheet">

  <!-- 기존 로그인 폼 -->
  <form method="post">
    <div class="grid-row">
      <div class="field">
        <label for="login_id">대리점 ID</label>
        <input id="login_id" name="login_id" type="text"
               placeholder="예: 본인 ID 또는 관리자 admin ID" required />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" required />
      </div>
    </div>
    <button type="submit" class="btn-primary">로그인</button>
  </form>

  <!-- 구분선 -->
  <div class="divider">또는</div>

  <!-- 🔵 Google 로그인 버튼 -->
  <a href="/login/google" class="google-btn">
    <img src="{{ url_for('static', filename='images/google_logo.png') }}"
         alt="Google Logo" class="google-icon">
    Google 계정으로 로그인
  </a>

</section>

{% endblock %}

<style>
/* ---- Google Login Button Style ---- */
.google-btn {
  width: 100%;
  background: #ffffff;
  border: 1px solid #dcdcdc;
  padding: 12px 0;
  margin-top: 12px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  color: #444;
  transition: 0.2s ease;
  text-decoration: none;
}

.google-btn:hover {
  background: #f7f7f7;
}

.google-icon {
  width: 20px;
  height: 20px;
}

/* ---- Divider ---- */
.divider {
  text-align: center;
  color: #aaa;
  margin: 18px 0;
  font-size: 14px;
}
</style>
