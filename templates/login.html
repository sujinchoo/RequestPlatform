{% extends "base.html" %}

{% block title %}로그인{% endblock %}
{% block header_title %}대리점 / 본사 로그인{% endblock %}

{% block content %}

<!-- ================================
     히어로 영역 / 배너
================================ -->
<section class="sheet sheet-hero">

  <div class="tpr-banner">
    <img src="{{ url_for('static', filename='images/tpr-banner.png') }}"
         alt="TPR System Banner"
         class="tpr-banner-img" />

    <div class="tpr-banner-text">
      <div class="tpr-banner-title">TPR System</div>
      <div class="tpr-banner-sub">Truck · People · Request Board</div>
    </div>
  </div>

  <div class="hero-title">로그인</div>
  <p class="hero-sub">
    대리점 ID와 비밀번호를 입력해주세요.<br>
    본사 계정(admin)은 대시보드 접근이 가능합니다.
  </p>

</section>


<!-- ================================
     로그인 폼 박스
================================ -->
<section class="sheet">

  <!-- 기본 로그인 폼 -->
  <form method="post">
    <div class="grid-row">

      <div class="field">
        <label for="login_id">대리점 ID</label>
        <input id="login_id" name="login_id" type="text"
               placeholder="예: 본인 ID 또는 관리자 admin ID"
               required />
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" required />
      </div>

    </div>

    <button type="submit" class="btn-primary">로그인</button>
  </form>


  <!-- 구분선 -->
  <div class="divider">또는</div>


  <!-- ================================
       Google 로그인 버튼 (이미지 기반)
  ================================= -->
  <button type="button" class="google-login-btn">
    <img src="{{ url_for('static', filename='images/GOOGLE_LOGO_SIGN.png') }}"
         alt="Google Login Button"
         class="google-login-img">
  </button>

</section>

{% endblock %}



<!-- ================================
     스타일
================================ -->
<style>

.divider {
  text-align: center;
  color: #aaa;
  margin: 18px 0;
  font-size: 14px;
}

/* Google 로그인 이미지 버튼 */
.google-login-btn {
  width: 100%;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  justify-content: center;
}

.google-login-img {
  width: 220px;         /* 버튼 크기 조절 가능 */
  max-width: 100%;      /* 반응형 */
  height: auto;
  display: block;
  border-radius: 8px;   /* 필요하면 제거 가능 */
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.google-login-btn:hover .google-login-img {
  opacity: 0.95;
}

</style>
