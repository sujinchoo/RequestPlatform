{% set hide_header = true %}
{% extends "base.html" %}

{% block title %}로그인{% endblock %}
{% block header_title %}대리점 / 본사 로그인{% endblock %}

{% block content %}

<!-- ================================
     히어로 영역 / 배너
================================ -->
<section class="sheet sheet-hero">

  <div class="tpr-banner">
    <img src="{{ url_for('static', filename='images/tpr-banner.png') }}"
         alt="TPR System Banner"
         class="tpr-banner-img" />

    <div class="tpr-banner-text">
      <div class="tpr-banner-title">TPR System</div>
      <div class="tpr-banner-sub">Truck · People · Request Systemboard</div>
    </div>
  </div>

  <div class="hero-title">로그인</div>
  <p class="hero-sub">
    대리점 ID와 비밀번호를 입력해주세요.<br>
    본사 계정(admin)은 대시보드 접근이 가능합니다.
  </p>

</section>


<!-- ================================
     로그인 폼 박스
================================ -->
<section class="sheet">

  <!-- 기본 로그인 폼 -->
  <form method="post">
    <div class="grid-row">

      <div class="field">
        <label for="login_id">대리점 ID</label>
        <input id="login_id" name="login_id" type="text"
               placeholder="예: 본인 ID 또는 관리자 admin ID"
               required />
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" required />
      </div>

    </div>

    <button type="submit" class="btn-primary">로그인</button>
  </form>


  <!-- 구분선 -->
  <div class="divider">또는</div>


  <!-- ================================
       Google 로그인 버튼 (이미지 기반)
  ================================= -->
  <button type="button"
          class="google-login-btn"
          onclick="window.location.href='{{ url_for('login_google_start') }}'">

    <img src="{{ url_for('static', filename='images/GOOGLE_LOGO_SIGN.png') }}"
         alt="Google Login Button"
         class="google-login-img">
  </button>

</section>

{% endblock %}


<!-- ================================
     스타일 (페이지 전용)
================================ -->
<style>

.divider {
  text-align: center;
  color: #aaa;
  margin: 18px 0;
  font-size: 14px;
}

/* Google 로그인 버튼 전체 */
.google-login-btn {
  width: 100%;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  justify-content: center;
}

/* Google 이미지 버튼 */
.google-login-img {
  width: 100%;
  max-width: 380px;
  height: auto;
  border-radius: 10px;
  display: block;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

/* Hover 효과 */
.google-login-btn:hover .google-login-img {
  transform: translateY(-3px);
  opacity: 0.95;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
}

</style>
