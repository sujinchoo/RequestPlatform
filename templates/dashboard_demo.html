{% extends "base.html" %}

{% block title %}오늘의 물류 요청 현황 — Demo{% endblock %}
{% block header_title %}SAAS Demo Dashboard{% endblock %}
{% block logo_color %}logo-square-green{% endblock %}

{% block extra_css %}
<style>
/* ------------------------------
   SaaS Demo Style
--------------------------------*/
.demo-container {
  background: #0d1220;
  color: #e5e7eb;
  padding: 20px;
  border-radius: 12px;
}

.demo-section {
  margin-bottom: 32px;
}

.demo-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 6px;
}

.demo-sub {
  font-size: 14px;
  color: #9ca3af;
  margin-bottom: 20px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.stat-card {
  background: #141a2a;
  padding: 18px;
  border-radius: 12px;
  border: 1px solid #1f2937;
}

.stat-card .count {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 4px;
}

.stat-card .label {
  font-size: 14px;
  color: #9ca3af;
}

/* 상태 바 */
.progress-container {
  background: #141a2a;
  border: 1px solid #1f2937;
  padding: 20px;
  border-radius: 12px;
}

.progress-bar {
  width: 100%;
  height: 12px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-inner {
  height: 12px;
  background: linear-gradient(90deg,
    #4ade80 {{ status_wait_pct }}%,
    #38bdf8 {{ status_pre_pct }}%,
    #c084fc {{ status_interview_pct }}%,
    #f87171 {{ status_done_pct }}%
  );
}
