{% extends "base.html" %}

{% block title %}DB TEST TOOL{% endblock %}
{% block header_title %}DB 테스트 도구{% endblock %}
{% block logo_color %}logo-square-green{% endblock %}

{% block content %}

<section class="sheet sheet-hero">
  <div class="hero-title">DB 테스트 페이지</div>
  <p class="hero-sub">GUI로 테스트 데이터 입력 또는 100개 랜덤 생성</p>
</section>

<section class="sheet">

  <div class="sheet-title-row">
    <div class="sheet-title">수동 입력</div>
    <div class="sheet-sub">7글자 이하 입력을 추천합니다</div>
  </div>

  <div class="form-group">
    <label>지역</label>
    <input id="in-region" class="input" maxlength="7">

    <label>택배사</label>
    <input id="in-company" class="input" maxlength="7">

    <label>영업소/대리점</label>
    <input id="in-branch" class="input" maxlength="7">

    <label>단가</label>
    <input id="in-unit" type="number" class="input">

    <label>월 물량</label>
    <input id="in-vol" type="number" class="input">

    <label>차종</label>
    <input id="in-vehicle" class="input" maxlength="7">

    <label>인원</label>
    <input id="in-head" type="number" class="input">

    <label>기타</label>
    <input id="in-etc" class="input" maxlength="7">
  </div>

  <button class="btn-primary" onclick="insertOne()">수동 입력 저장</button>


  <hr style="margin:40px 0;">


  <div class="sheet-title-row">
    <div class="sheet-title">자동 생성</div>
    <div class="sheet-sub">100개의 랜덤 데이터 자동 삽입</div>
  </div>

  <button class="btn-secondary" onclick="generate100()">랜덤 100개 생성</button>

</section>


<script>
function insertOne() {
    const payload = {
        region: document.getElementById("in-region").value,
        company: document.getElementById("in-company").value,
        branch_name: document.getElementById("in-branch").value,
        unit_price: document.getElementById("in-unit").value,
        volume: document.getElementById("in-vol").value,
        vehicle_type: document.getElementById("in-vehicle").value,
        headcount: document.getElementById("in-head").value,
        etc: document.getElementById("in-etc").value
    };

    fetch("/api/dbtest-insert", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(json => {
        if (json.success) {
            alert("✔ 저장되었습니다!");
        } else {
            alert("저장 실패: " + json.error);
        }
    });
}


function generate100() {
    if (!confirm("랜덤 데이터 100개를 생성하시겠습니까?")) return;

    fetch("/api/dbtest-generate", { method: "POST" })
    .then(res => res.json())
    .then(json => {
        if (json.success) {
            alert("💯 랜덤 데이터 100개 생성 완료!");
        } else {
            alert("오류 발생: " + json.error);
        }
    });
}

</script>

{% endblock %}
